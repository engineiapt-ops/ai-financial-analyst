name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require lockfile
        run: |
          test -f package-lock.json
          echo "package-lock.json present"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint 2>&1 | tee /tmp/lint.log

      - name: Report lint diagnostics
        if: steps.lint.outcome == "failure"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint.log
          exit 1

      - name: Release gate
        run: npm run release:gate

      - name: Docker build
        run: docker build --tag ai-financial-analyst:ci .
