name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require lockfile
        run: |
          test -f package-lock.json
          echo "package-lock.json present"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/lint.log
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Publish lint diagnostics
        if: steps.lint.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          LINT_LOG: /tmp/lint.log
        with:
          script: |
            const fs = require("fs");
            const output = fs.readFileSync(process.env.LINT_LOG, "utf8").slice(0, 12000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "TEMP LINT DIAGNOSTICS\\n\\n```text\\n" + output + "\\n```",
            });

      - name: Fail on lint
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Release gate
        run: npm run release:gate

      - name: Docker build
        run: docker build --tag ai-financial-analyst:ci .
