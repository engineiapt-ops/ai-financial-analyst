name: Debug Lint

on:
  push:
    branches:
      - fix/safe-core-api-errors

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run lint > /tmp/lint.log 2>&1
      - name: Publish diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const output = fs.readFileSync("/tmp/lint.log", "utf8").slice(0, 6000);
            const pr = context.payload.ref.includes("fix/safe-core-api-errors")
              ? (await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${context.repo.owner}:fix/safe-core-api-errors`,
                  state: "open"
                })).data[0]
              : null;
            if (!pr) core.setFailed("Open PR not found");
            else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: "TEMP LINT DIAGNOSTICS\\n\\n```text\\n" + output + "\\n```"
              });
            }
      - name: Fail when lint fails
        if: steps.lint.outcome == 'failure'
        run: exit 1
